<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="AragonRouter">
  <title>AragonRouter</title>
  <!--
    AragonRouter brand mark, iOS home-screen variant (180x180).

    This SVG is the vector master of the iOS tile. iOS has no SVG support for
    `apple-touch-icon` and the App Router routes only `apple-icon.{jpg,jpeg,png}`
    (SVG is absent from `STATIC_METADATA_IMAGES.apple` in Next), so the file that is
    actually served and linked as `<link rel="apple-touch-icon" sizes="180x180">` is
    the byte-controlled raster `src/app/apple-icon.png` in this same directory. That
    PNG is rasterised by `src/components/brand/generate-apple-icon.mjs` (zero
    dependencies, zlib + CRC32) from the glyph coordinates below, which the script
    duplicates as constants - nothing verifies the SVG/PNG correspondence, so after
    editing any path data here or in icon.svg you must re-run
      node src/components/brand/generate-apple-icon.mjs
    and commit both files. The check-only mode of the script re-validates the
    committed PNG only, never this SVG.

    Full-bleed 180x180 plate: iOS applies its own corner mask, so the plate carries
    no radius and the glyph keeps the same optical margin as the 32x32 favicon
    (identical geometry, scaled by 180 / 32 = 5.625).

    Colour: C10 tokens only - brand plate #3ecf8e, glyph #121212 (the bg token).
    No external fonts, no bitmap, no base64 payload.
  -->
  <rect width="180" height="180" fill="#3ecf8e"/>
  <g transform="scale(5.625)" fill="#121212">
    <path d="M14.1 6H17.9L26 25.8H21.4L16 12.6L10.6 25.8H6Z"/>
    <path d="M12.4 17.4H19.6V20.8H12.4Z"/>
  </g>
</svg>
