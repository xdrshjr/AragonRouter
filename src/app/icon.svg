<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="AragonRouter">
  <title>AragonRouter</title>
  <!--
    AragonRouter brand mark, favicon variant (App Router file convention: this file
    is served as /icon.svg and Next injects <link rel="icon" type="image/svg+xml">).

    Geometry: geometric "A" chevron with a truncated, flat-cut apex and a deep inner
    notch, plus a bridging crossbar - flat shapes only, no gradients, no strokes that
    collapse below one device pixel at 16x16.

    Colour: C10 tokens only - brand plate #3ecf8e, glyph #121212 (the bg token).
    No external fonts, no bitmap, no base64 payload.
  -->
  <rect width="32" height="32" rx="7" fill="#3ecf8e"/>
  <path d="M14.1 6H17.9L26 25.8H21.4L16 12.6L10.6 25.8H6Z" fill="#121212"/>
  <path d="M12.4 17.4H19.6V20.8H12.4Z" fill="#121212"/>
</svg>
